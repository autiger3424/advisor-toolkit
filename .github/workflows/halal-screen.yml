name: Halal ideas screen

on:
  schedule:
    # Sundays at 20:30 UTC (3:30 pm Central), ahead of the core screen. Markets are closed, Friday data is final.
    - cron: "30 20 * * 0"
  workflow_dispatch:
    inputs:
      screen_limit:
        description: "Candidates per sector (lower for a quick test run)"
        required: false
        default: "45"

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check secrets
        run: |
          if [ -z "${{ secrets.FMP_API_KEY }}" ] || [ -z "${{ secrets.TWELVE_DATA_API_KEY }}" ]; then
            echo "Add FMP_API_KEY and TWELVE_DATA_API_KEY under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Run screen
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TD_CALLS_PER_MIN: ${{ vars.TD_CALLS_PER_MIN || '8' }}
          SCREEN_LIMIT: ${{ github.event.inputs.screen_limit || '45' }}
        run: node scripts/halal-screen.mjs

      - name: Commit updated list
        run: |
          git config user.name "halal-screen[bot]"
          git config user.email "halal-screen@users.noreply.github.com"
          if [ -z "$(git status --porcelain -- src/data/halal-ideas.json)" ]; then
            echo "No changes this week."
            exit 0
          fi
          git add src/data/halal-ideas.json
          git commit -m "Halal ideas: $(date -u +%Y-%m-%d)"
          # GitHub occasionally rejects a push with a transient "fatal error in commit_refs";
          # retry a few times before giving up.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --quiet origin main && git push origin HEAD:main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push failed (attempt $attempt), retrying in 30s..."
            sleep 30
          done
          echo "Push failed after 5 attempts."
          exit 1
