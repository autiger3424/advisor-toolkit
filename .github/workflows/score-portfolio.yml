name: Weekly portfolio re-score

on:
  schedule:
    # Sundays at 23:40 UTC (6:40 pm Central), after the ideas screen.
    - cron: "40 23 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check secrets
        run: |
          if [ -z "${{ secrets.FMP_API_KEY }}" ]; then
            echo "Add FMP_API_KEY under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Re-score the model portfolio
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: node scripts/score-portfolio.mjs

      - name: Upload as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: model-portfolio
          path: src/data/model-portfolio.json

      - name: Commit updated portfolio
        run: |
          git config user.name "score-portfolio[bot]"
          git config user.email "score-portfolio@users.noreply.github.com"
          if git diff --quiet -- src/data/model-portfolio.json; then
            echo "No changes this week."
            exit 0
          fi
          git add src/data/model-portfolio.json
          git commit -m "Portfolio re-score: $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --quiet origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}"; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push failed (attempt $attempt), retrying in 30s..."
            sleep 30
          done
          echo "Push failed after 5 attempts."
          exit 1
