name: Weekly ideas screen

on:
  schedule:
    # Sundays at 23:00 UTC (6 pm Central). Markets are closed, Friday data is final.
    - cron: "0 23 * * 0"
  workflow_dispatch:
    inputs:
      screen_limit:
        description: "Candidates per sector (lower for a quick test run)"
        required: false
        default: "15"

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check secrets
        run: |
          if [ -z "${{ secrets.FMP_API_KEY }}" ]; then
            echo "Add FMP_API_KEY under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Run screen
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          SCREEN_LIMIT: ${{ github.event.inputs.screen_limit || '15' }}
        run: node scripts/screen.mjs

      - name: Upload list as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-ideas
          path: src/data/weekly-ideas.json

      # Commits to whichever branch the run started from: main on the Sunday schedule,
      # a feature branch when dispatched there (so a trial run never touches main).
      - name: Commit updated list
        run: |
          git config user.name "weekly-screen[bot]"
          git config user.email "weekly-screen@users.noreply.github.com"
          if git diff --quiet -- src/data/weekly-ideas.json; then
            echo "No changes this week."
            exit 0
          fi
          git add src/data/weekly-ideas.json
          git commit -m "Weekly ideas: $(date -u +%Y-%m-%d)"
          # GitHub occasionally rejects a push with a transient "fatal error in commit_refs";
          # retry a few times before giving up.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --quiet origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}"; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push failed (attempt $attempt), retrying in 30s..."
            sleep 30
          done
          echo "Push failed after 5 attempts."
          exit 1
